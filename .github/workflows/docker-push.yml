name: Docker Build and Push

on:
  workflow_run:
    workflows:
      - 03-Cypress-E2E
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            shtven/dswpractica02:backend
            shtven/dswpractica02:backend-${{ github.sha }}
            shtven/dswpractica02:backend-${{ github.ref_name }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            shtven/dswpractica02:frontend
            shtven/dswpractica02:frontend-${{ github.sha }}
            shtven/dswpractica02:frontend-${{ github.ref_name }}
