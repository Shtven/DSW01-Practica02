name: Unit Tests (Frontend and Backend)

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-unit-tests:
    name: Frontend Unit Tests (Node LTS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

  backend-unit-tests:
    name: Backend Unit Tests (Java 17)
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-17
    strategy:
      fail-fast: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run backend unit tests
        run: mvn -B test

  post-validation-gate:
    name: Post Validation Gate
    runs-on: ubuntu-latest
    needs:
      - frontend-unit-tests
      - backend-unit-tests
    if: ${{ success() }}
    steps:
      - name: Confirm both unit-test jobs passed
        run: echo "Unit tests passed."

      - name: Docker pull nginx image
        run: docker pull nginx:1.27-alpine
