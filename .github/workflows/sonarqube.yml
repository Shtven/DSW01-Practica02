name: SonarQube Analysis

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Backend
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend classes
        run: mvn -B -DskipTests compile

      # =========================
      # Frontend
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Dependencias necesarias para Angular + Vitest
      - name: Install Vitest coverage dependency
        working-directory: frontend
        run: npm install -D @vitest/coverage-v8

      - name: Install Vitest browser dependency
        working-directory: frontend
        run: npm install -D @vitest/browser playwright

      # Ejecutar tests con coverage
      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm test -- --coverage

      # =========================
      # Validate Sonar secrets
      # =========================
      - name: Validate Sonar secrets
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "Missing required secret: SONAR_TOKEN"
            exit 1
          fi

          if [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "Missing required secret: SONAR_HOST_URL"
            exit 1
          fi

          if [ -z "${{ secrets.SONAR_ORGANIZATION }}" ]; then
            echo "Missing required secret: SONAR_ORGANIZATION"
            exit 1
          fi

          if [ -z "${{ secrets.SONAR_PROJECT_KEY }}" ]; then
            echo "Missing required secret: SONAR_PROJECT_KEY"
            exit 1
          fi

      # =========================
      # DEBUG SONAR VARIABLES
      # =========================
      - name: Debug Sonar variables
        run: |
          echo "=============================="
          echo "SONAR_HOST_URL:"
          echo "${{ secrets.SONAR_HOST_URL }}"
          echo ""
          echo "SONAR_ORGANIZATION:"
          echo "${{ secrets.SONAR_ORGANIZATION }}"
          echo ""
          echo "SONAR_PROJECT_KEY:"
          echo "${{ secrets.SONAR_PROJECT_KEY }}"
          echo ""
          echo "SONAR_PROJECT_NAME:"
          echo "${{ secrets.SONAR_PROJECT_NAME }}"
          echo "=============================="

      # =========================
      # Validate token manually
      # =========================
      - name: Validate Sonar token against API
        run: |
          curl -v -u "${{ secrets.SONAR_TOKEN }}:" \
          "${{ secrets.SONAR_HOST_URL }}/api/authentication/validate"

      # =========================
      # Test Quality Gate API manually
      # =========================
      - name: Manual Quality Gate API test
        run: |
          curl -v -u "${{ secrets.SONAR_TOKEN }}:" \
          "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECT_KEY }}"

      # =========================
      # Verify coverage exists
      # =========================
      - name: Verify coverage files
        run: |
          echo "========== COVERAGE FILES =========="
          ls -R frontend/coverage || true
          echo "===================================="

      # =========================
      # SonarQube Scan
      # =========================
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ secrets.SONAR_PROJECT_NAME }}
            -Dsonar.sources=src,frontend/src
            -Dsonar.tests=frontend/cypress
            -Dsonar.exclusions=frontend/src/**/*.spec.ts
            -Dsonar.java.binaries=target/classes
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

      # =========================
      # Debug generated report
      # =========================
      - name: Debug Sonar report
        run: |
          echo "========== report-task.txt =========="
          cat .scannerwork/report-task.txt
          echo "====================================="

      # =========================
      # Extract CE task URL
      # =========================
      - name: Debug CE task
        run: |
          CE_TASK_URL=$(grep ceTaskUrl .scannerwork/report-task.txt | cut -d= -f2)

          echo "CE_TASK_URL=$CE_TASK_URL"

          curl -v -u "${{ secrets.SONAR_TOKEN }}:" "$CE_TASK_URL"

      # =========================
      # Debug dashboard URL
      # =========================
      - name: Debug dashboard URL
        run: |
          DASHBOARD_URL=$(grep dashboardUrl .scannerwork/report-task.txt | cut -d= -f2)

          echo "DASHBOARD_URL=$DASHBOARD_URL"

      # =========================
      # Quality Gate
      # =========================
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # =========================
      # Final debug if Quality Gate fails
      # =========================
      - name: Final Sonar debug
        if: always()
        run: |
          echo "========== FINAL DEBUG =========="
          echo "HOST: ${{ secrets.SONAR_HOST_URL }}"
          echo "ORG: ${{ secrets.SONAR_ORGANIZATION }}"
          echo "KEY: ${{ secrets.SONAR_PROJECT_KEY }}"
          echo "================================="