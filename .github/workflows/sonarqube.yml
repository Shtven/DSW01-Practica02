name: SonarQube Analysis

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Backend
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend classes
        run: mvn -B -DskipTests compile

      # =========================
      # Frontend
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Dependencias necesarias para Angular + Vitest
      - name: Install Vitest coverage dependency
        working-directory: frontend
        run: npm install -D @vitest/coverage-v8

      - name: Install Vitest browser dependency
        working-directory: frontend
        run: npm install -D @vitest/browser playwright

      # Ejecutar tests con coverage
      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm test -- --coverage

      # =========================
      # Validate Sonar secrets
      # =========================
      - name: Validate Sonar secrets
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "Missing required secret: SONAR_TOKEN"
            exit 1
          fi

          if [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "Missing required secret: SONAR_HOST_URL"
            exit 1
          fi
      # =========================
      # Debug Sonar configuration
      # =========================
      - name: Debug Sonar variables
        run: |
          echo "SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }}"
          echo "SONAR_ORGANIZATION=${{ secrets.SONAR_ORGANIZATION }}"
          echo "SONAR_PROJECT_KEY=${{ secrets.SONAR_PROJECT_KEY }}"
          echo "SONAR_PROJECT_NAME=${{ secrets.SONAR_PROJECT_NAME }}"

      - name: Validate Sonar token against API
        run: |
          curl -v -u "${{ secrets.SONAR_TOKEN }}:" \
          "${{ secrets.SONAR_HOST_URL }}/api/authentication/validate"

      - name: Debug effective sonar values
        run: |
          echo "ORG=${{ secrets.SONAR_ORGANIZATION }}"
          echo "KEY=${{ secrets.SONAR_PROJECT_KEY }}"
          echo "HOST=${{ secrets.SONAR_HOST_URL }}"

      # =========================
      # SonarQube Scan
      # =========================
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ secrets.SONAR_PROJECT_NAME }}
            -Dsonar.sources=src,frontend/src
            -Dsonar.tests=frontend/cypress
            -Dsonar.java.binaries=target/classes
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

      - name: Debug Sonar URL
        run: |
          echo "${{ secrets.SONAR_HOST_URL }}"
          
      - name: Debug Sonar report
        run: |
          echo "========== report-task.txt =========="
          cat .scannerwork/report-task.txt
          echo "====================================="

      # =========================
      # Quality Gate
      # =========================
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}