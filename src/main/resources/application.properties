spring.application.name=empleados

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:empleadosdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.bootstrap_admin_email=${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
spring.flyway.placeholders.bootstrap_admin_password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}

app.auth.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
