services:
  postgres:
    image: postgres:16
    container_name: empleados-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-empleadosdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: empleados-app
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-empleadosdb}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[j]ava -jar app.jar'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: empleados-nginx
    depends_on:
      app:
        condition: service_healthy
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api}
    ports:
      - "80:80"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
